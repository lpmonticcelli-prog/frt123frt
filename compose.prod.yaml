# compose.prod.yaml (Exclusivo para DigitalOcean)
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    user: "${WWWUSER:-1000}:${WWWGROUP:-1000}"
    restart: unless-stopped
    ports:
      - "80:8000" # Mapeia a porta 80 externa direto para o FrankenPHP
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - OCTANE_SERVER=frankenphp
      - DB_CONNECTION=pgsql
      - DB_HOST=pgsql
      - DB_PORT=5432
      - DB_DATABASE=fretei
      - DB_USERNAME=postgres
      - DB_PASSWORD=${DB_PASSWORD:-postgres_prod_secure}
      - CACHE_STORE=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
      - REDIS_CLIENT=phpredis
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD:-null}
      - REDIS_PORT=6379
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy
      pgsql:
        condition: service_healthy
    networks:
      - fretei_net

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    user: "${WWWUSER:-1000}:${WWWGROUP:-1000}"
    restart: unless-stopped
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    environment:
      - APP_ENV=production
      - DB_CONNECTION=pgsql
      - DB_HOST=pgsql
      - DB_PORT=5432
      - DB_DATABASE=fretei
      - DB_USERNAME=postgres
      - DB_PASSWORD=${DB_PASSWORD:-postgres_prod_secure}
      - CACHE_STORE=redis
      - QUEUE_CONNECTION=redis
      - REDIS_HOST=redis
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy
      pgsql:
        condition: service_healthy
    networks:
      - fretei_net

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    user: "${WWWUSER:-1000}:${WWWGROUP:-1000}"
    restart: unless-stopped
    command: php artisan schedule:work
    environment:
      - APP_ENV=production
      - DB_CONNECTION=pgsql
      - DB_HOST=pgsql
      - DB_PORT=5432
      - DB_DATABASE=fretei
      - DB_USERNAME=postgres
      - DB_PASSWORD=${DB_PASSWORD:-postgres_prod_secure}
      - REDIS_HOST=redis
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy
      pgsql:
        condition: service_healthy
    networks:
      - fretei_net

  reverb:
    build:
      context: .
      dockerfile: Dockerfile
    user: "${WWWUSER:-1000}:${WWWGROUP:-1000}"
    restart: unless-stopped
    command: php artisan reverb:start --host="0.0.0.0" --port=8082
    ports:
      - "8082:8082"
    environment:
      - APP_ENV=production
      - DB_CONNECTION=pgsql
      - DB_HOST=pgsql
      - DB_PORT=5432
      - DB_DATABASE=fretei
      - DB_USERNAME=postgres
      - DB_PASSWORD=${DB_PASSWORD:-postgres_prod_secure}
      - REDIS_HOST=redis
    depends_on:
      redis:
        condition: service_healthy
      pgsql:
        condition: service_healthy
    networks:
      - fretei_net

  redis:
    image: 'redis:alpine'
    restart: unless-stopped
    # Portas omitidas para não expor o Redis para a internet (Segurança)
    volumes:
      - 'fretei_redis:/data'
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-null}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      retries: 3
      timeout: 5s
    networks:
      - fretei_net

  pgsql:
    image: 'postgres:16-alpine'
    restart: unless-stopped
    # Portas omitidas para não expor o BD para a internet (Segurança)
    environment:
      POSTGRES_DB: fretei
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_prod_secure}
    volumes:
      - 'fretei_pgsql:/var/lib/postgresql/data'
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "fretei", "-U", "postgres"]
      retries: 3
      timeout: 5s
    networks:
      - fretei_net

volumes:
  fretei_redis:
    driver: local
  fretei_pgsql:
    driver: local

networks:
  fretei_net:
    driver: bridge