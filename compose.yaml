version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fretei_app
    user: "${WWWUSER:-1000}:${WWWGROUP:-1000}"
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - OCTANE_SERVER=frankenphp
      - DB_CONNECTION=pgsql
      - DB_HOST=pgsql
      - DB_PORT=5432
      - DB_DATABASE=fretei
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - CACHE_STORE=redis
      - SESSION_DRIVER=array
      - QUEUE_CONNECTION=redis
      - REDIS_CLIENT=phpredis
      - REDIS_HOST=redis
      - REDIS_PASSWORD=null
      - REDIS_PORT=6379
      - AWS_ENDPOINT=http://minio:9000
      - AWS_URL=http://localhost:9000/fretei-bucket
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy
      pgsql:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - fretei_net

  # [INFRA] Worker (Horizon)
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fretei_worker
    user: "${WWWUSER:-1000}:${WWWGROUP:-1000}"
    command: php artisan horizon
    environment:
      - APP_ENV=local
      - DB_CONNECTION=pgsql
      - DB_HOST=pgsql
      - DB_PORT=5432
      - DB_DATABASE=fretei
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - CACHE_STORE=redis
      - SESSION_DRIVER=array
      - QUEUE_CONNECTION=redis
      - REDIS_HOST=redis
      - AWS_ENDPOINT=http://minio:9000
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy
      pgsql:
        condition: service_healthy
    networks:
      - fretei_net
    healthcheck:
      disable: true

  # [INFRA] Scheduler
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fretei_scheduler
    user: "${WWWUSER:-1000}:${WWWGROUP:-1000}"
    command: php artisan schedule:work
    environment:
      - APP_ENV=local
      - DB_CONNECTION=pgsql
      - DB_HOST=pgsql
      - DB_PORT=5432
      - DB_DATABASE=fretei
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - CACHE_STORE=redis
      - SESSION_DRIVER=array
      - REDIS_HOST=redis
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy
      pgsql:
        condition: service_healthy
    networks:
      - fretei_net
    healthcheck:
      disable: true

  # [INFRA] Reverb WebSockets
  reverb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fretei_reverb
    user: "${WWWUSER:-1000}:${WWWGROUP:-1000}"
    command: php artisan reverb:start --host="0.0.0.0" --port=8082
    ports:
      - "8082:8082"
    environment:
      - APP_ENV=local
      - DB_CONNECTION=pgsql
      - DB_HOST=pgsql
      - DB_PORT=5432
      - DB_DATABASE=fretei
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - REDIS_HOST=redis
      - SESSION_DRIVER=array
    depends_on:
      redis:
        condition: service_healthy
      pgsql:
        condition: service_healthy
    networks:
      - fretei_net
    healthcheck:
      disable: true

  # [INFRA] Data & Cache
  redis:
    image: 'redis:alpine'
    container_name: fretei_redis
    ports:
      - '6379:6379'
    volumes:
      - 'fretei_redis:/data'
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      retries: 3
      timeout: 5s
    networks:
      - fretei_net

  pgsql:
    image: 'postgres:16-alpine'
    container_name: fretei_pgsql
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: fretei
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - 'fretei_pgsql:/var/lib/postgresql/data'
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "fretei", "-U", "postgres"]
      retries: 3
      timeout: 5s
    networks:
      - fretei_net

  # [INFRA] S3 Emulator (MinIO)
  minio:
    image: minio/minio:latest
    container_name: fretei_minio
    ports:
      - "9000:9000"
      - "8900:8900"
    environment:
      MINIO_ROOT_USER: root
      MINIO_ROOT_PASSWORD: password123
    command: server /data --console-address ":8900"
    volumes:
      - fretei_s3_data:/data
    networks:
      - fretei_net

  minio-setup:
    image: minio/mc
    container_name: fretei_minio_setup
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 root password123;
      mc mb local/fretei-bucket || true;
      mc anonymous set public local/fretei-bucket || true;
      exit 0;
      "
    networks:
      - fretei_net

  # [INFRA] SMTP Catcher (Mailpit)
  mailpit:
    image: axllent/mailpit
    container_name: fretei_mailpit
    ports:
      - "1025:1025" # Porta SMTP
      - "8025:8025" # Interface Web
    networks:
      - fretei_net

  # MICROSERVIÇO DE RASTREAMENTO EM TEMPO REAL (GO)
  tracking:
    build:
      context: ./tracking-service
      dockerfile: Dockerfile
    container_name: fretei_tracking
    ports:
      - "8081:8080" 
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - fretei_net

volumes:
  fretei_redis:
    driver: local
  fretei_pgsql:
    driver: local
  fretei_s3_data:
    driver: local

networks:
  fretei_net:
    driver: bridge